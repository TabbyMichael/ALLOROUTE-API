name: CI Pipeline (Free Tier Optimized)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: alloroute_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt bandit

      - name: Run Quality Checks (Lint & Security)
        run: |
          black --check .
          isort --check-only .
          bandit -r apps/ services/ config/ -x tests/

      - name: Run Tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/alloroute_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-key-safe-for-public-repo
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: pytest --cov=. --cov-report=term

      # Only build Docker if tests pass and we are on main branch
      - name: Build Docker Image (No Push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: docker build -t alloroute-api:latest .
